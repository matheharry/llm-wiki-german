name: Release

on:
  push:
    tags:
      - "*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - name: Verify tag matches manifest version
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          manifest_version="$(node -p "JSON.parse(require('fs').readFileSync('manifest.json','utf8')).version")"
          min_app_version="$(node -p "JSON.parse(require('fs').readFileSync('manifest.json','utf8')).minAppVersion")"
          package_version="$(node -p "JSON.parse(require('fs').readFileSync('package.json','utf8')).version")"
          versions_entry="$(node -p "JSON.parse(require('fs').readFileSync('versions.json','utf8'))['${manifest_version}'] ?? ''")"
          echo "tag=${GITHUB_REF_NAME} manifest=${manifest_version} package=${package_version} minApp=${min_app_version} versions.json=${versions_entry}"
          # Obsidian only installs a release whose tag matches manifest.json's
          # version, so a mistyped tag would publish a dead release.
          if [ "${tag}" != "${manifest_version}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match manifest.json version ${manifest_version}"
            exit 1
          fi
          if [ "${package_version}" != "${manifest_version}" ]; then
            echo "::error::package.json version ${package_version} does not match manifest.json version ${manifest_version}"
            exit 1
          fi
          if [ "${versions_entry}" != "${min_app_version}" ]; then
            echo "::error::versions.json entry for ${manifest_version} is '${versions_entry}', expected minAppVersion ${min_app_version}"
            exit 1
          fi
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
      - name: Create release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            main.js manifest.json styles.css
